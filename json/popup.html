<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON Beautifier</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-card">
    <header class="popup-header">
      <div class="popup-brand">
        <div class="popup-logo">{ }</div>
        <div>
          <h2>JSON Beautifier</h2>
          <p>Instant Formatter & Viewer</p>
        </div>
      </div>
    </header>

    <main class="popup-body">
      <!-- Quick Action: Active Selection -->
      <button id="btnFormatSelection" class="btn btn-primary full-width">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Format Selected Text on Page
      </button>

      <!-- Open Blank Window / Tab -->
      <button id="btnOpenBlank" class="btn btn-secondary full-width" style="margin-top: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open Blank Viewer Tab
      </button>

      <!-- Open Local JSON File -->
      <button id="btnOpenLocalFile" class="btn btn-secondary full-width" style="margin-top: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Open Local JSON File
      </button>
      <input type="file" id="popupFileInput" accept=".json,.txt,.log,application/json" style="display: none;">

      <div class="divider">
        <span>OR PASTE JSON MANUALLY</span>
      </div>

      <!-- Paste Input -->
      <div class="input-group">
        <textarea id="jsonInput" placeholder="Paste unformatted JSON text here..." rows="6"></textarea>
      </div>

      <div id="errorMessage" class="error-box hidden"></div>

      <button id="btnFormatInput" class="btn btn-accent full-width">
        Beautify & Open Tree Viewer
      </button>
    </main>

    <footer class="popup-footer">
      <div class="shortcut-tip">
        <span class="badge">Tip</span> Select text & press <kbd>Ctrl</kbd> + <kbd>Shift</kbd> on any page
      </div>
      <div class="popup-credit">
        <em>Crafted by Sanith</em>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
